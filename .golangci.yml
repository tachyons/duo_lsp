# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt # standard Go formatting
    - goimports # import ordering + gofmt

linters:
  default: none
  enable:
    # Correctness
    - errcheck # unchecked errors
    - govet # go vet checks
    - staticcheck # staticcheck SA/S/ST rules
    - ineffassign # assignments whose value is never used
    - unused # unused code

    # Style / maintainability
    - misspell # common spelling mistakes in comments/strings
    - godot # comments should end with a period
    - revive # opinionated linter (replaces golint)
    - whitespace # leading/trailing blank lines

    # Bugs / security
    - bodyclose # HTTP response body must be closed
    - noctx # HTTP requests should use context
    - gosec # security issues (G-rules)
    - nilerr # returning nil after checking err != nil

    # Complexity
    - cyclop # cyclomatic complexity
    - funlen # function length
