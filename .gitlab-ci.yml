default:
  image: golang:1.22

variables:
  CGO_ENABLED: "0"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOFLAGS: "-mod=readonly"
  # Full clone required by GoReleaser (changelog) and semantic-release (tag history).
  GIT_DEPTH: "0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .go/pkg/mod/

stages:
  - test
  - tag
  - release

# ── Test ──────────────────────────────────────────────────────────────────────
test:
  stage: test
  script:
    - go test ./...
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

# ── Auto tag ──────────────────────────────────────────────────────────────────
# Reads conventional commits since the last vX.Y.Z tag, bumps the version
# accordingly, and pushes a new tag using CI_JOB_TOKEN — no stored secrets.
#
# Bump rules:
#   feat:            minor bump  (v1.2.3 → v1.3.0)
#   fix/perf/refactor: patch bump  (v1.2.3 → v1.2.4)
#   BREAKING CHANGE:   major bump  (v1.2.3 → v2.0.0)
#   anything else:   no tag created
#
# One-time setup:
#   Settings → Repository → Protected tags → add rule "v*",
#   allow "Roles: Maintainer" and tick "CI/CD job token".
auto-tag:
  stage: tag
  image: alpine:3.19
  before_script:
    - apk add --no-cache git curl
    - git remote set-url origin
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
  script:
    - |
      # Find the most recent semver tag; if none exists log all commits.
      LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
      echo "Last tag: ${LAST_TAG:-<none>}"

      if [ -n "$LAST_TAG" ]; then
        COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
      else
        COMMITS=$(git log --pretty=format:"%s")
      fi
      echo "Commits since ${LAST_TAG}:"
      echo "$COMMITS"

      if [ -z "$COMMITS" ]; then
        echo "No commits since last tag — nothing to do."
        exit 0
      fi

      # Determine bump type from conventional commit prefixes.
      BUMP=""
      while IFS= read -r msg; do
        case "$msg" in
          *"BREAKING CHANGE"*|*"!:"*)
            BUMP="major"; break ;;
          feat:*|feat\(*\):*)
            [ "$BUMP" != "major" ] && BUMP="minor" ;;
          fix:*|fix\(*\):*|perf:*|perf\(*\):*|refactor:*|refactor\(*\):*)
            [ "$BUMP" = "" ] && BUMP="patch" ;;
        esac
      done <<EOF
      $COMMITS
      EOF

      if [ -z "$BUMP" ]; then
        echo "No releasable commits found — skipping tag."
        exit 0
      fi

      # Parse MAJOR.MINOR.PATCH from the last tag (default 0.0.0 for arithmetic).
      VERSION=${LAST_TAG:-v0.0.0}
      VERSION=${VERSION#v}
      MAJOR=$(echo "$VERSION" | cut -d. -f1)
      MINOR=$(echo "$VERSION" | cut -d. -f2)
      PATCH=$(echo "$VERSION" | cut -d. -f3)

      case "$BUMP" in
        major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
        minor) MINOR=$((MINOR+1)); PATCH=0 ;;
        patch) PATCH=$((PATCH+1)) ;;
      esac

      NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
      echo "Bump: $BUMP → $NEW_TAG"

      git tag "$NEW_TAG"
      git push origin "$NEW_TAG"
      echo "Pushed $NEW_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# ── GoReleaser ────────────────────────────────────────────────────────────────
# Builds cross-platform binaries, creates archives + checksums, publishes the
# GitLab Release, and commits Formula/duo-lsp.rb back into this same repo.
# All authenticated via CI_JOB_TOKEN — no stored secrets.
#
# Homebrew tap points at this repo:
#   brew tap tachyons/duo-lsp https://gitlab.com/tachyons/duo_mini_lsp
#   brew install duo-lsp
goreleaser:
  stage: release
  image:
    name: goreleaser/goreleaser
    entrypoint: [""]
  variables:
    GITLAB_TOKEN: "$CI_JOB_TOKEN"
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
