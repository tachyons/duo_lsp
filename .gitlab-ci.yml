default:
  image: golang:1.22

variables:
  CGO_ENABLED: "0"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOFLAGS: "-mod=readonly"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .go/pkg/mod/

stages:
  - test
  - tag
  - release

# ── Test ──────────────────────────────────────────────────────────────────────
test:
  stage: test
  script:
    - go test ./...
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Semantic tag ─────────────────────────────────────────────────────────────
# Runs on every push to main. Analyses conventional commits since the last tag,
# creates a new semver tag if warranted, and triggers the release job via that tag.
semantic-release:
  stage: tag
  image: node:20-slim
  variables:
    GIT_DEPTH: "0"
  before_script:
    - npm install --no-save
        semantic-release
        @semantic-release/commit-analyzer
        @semantic-release/release-notes-generator
        @semantic-release/gitlab
        conventional-changelog-conventionalcommits
  script:
    - npx semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# ── Release ───────────────────────────────────────────────────────────────────
# Runs only on semver tags (v1.2.3 / v1.2.3-rc.1 etc.)
release:
  stage: release
  image:
    name: goreleaser/goreleaser:v2
    entrypoint: [""]
  variables:
    # GITLAB_TOKEN    – project access token with api + write_repository scope
    #                   set in CI/CD → Variables (masked, protected)
    # HOMEBREW_TAP_TOKEN – project/deploy token for the tap repo with
    #                   write_repository scope; set in CI/CD → Variables
    GIT_DEPTH: "0"   # GoReleaser needs full history for the changelog
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
